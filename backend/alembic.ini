# A generic, single database configuration.

[alembic]
# path to migration scripts.
# Use forward slashes (/) also on windows to provide an os agnostic path
script_location = migrations

# sys.path prepend — so Alembic can import `app.*` modules
prepend_sys_path = .

# template used to generate migration file names;
# The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be named in a
# temporary format where the date is used as a prefix
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# The URL is intentionally left EMPTY here.
# It is overridden at runtime by migrations/env.py which reads
# from Pydantic Settings → backend/.env → DATABASE_URL.
# This avoids hardcoding credentials in a file that may be committed.
sqlalchemy.url =

[post_write_hooks]
# Uncomment to run black on newly generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
